<div class="mode-selector">
  <h2 class="mode-selector__title">What do you want to show?</h2>

  <div class="mode-selector__cards">
    <button class="mode-selector__card" (click)="selectScale()">
      <span class="mode-selector__card-icon">🎵</span>
      <span class="mode-selector__card-label">Scale</span>
      <span class="mode-selector__card-desc">
        Learn scale notes, intervals and positions
      </span>
    </button>

    <button class="mode-selector__card" (click)="selectScaleChord()">
      <span class="mode-selector__card-icon">🔗</span>
      <span class="mode-selector__card-label">Scale + chord</span>
      <span class="mode-selector__card-desc">
        Compare a scale with a chord and see chord tones and relationships
      </span>
    </button>
  </div>
</div>
