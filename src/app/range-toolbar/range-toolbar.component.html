<section class="range-card">
  <div class="range-card__title">
    <span>Fret Range</span>
    <button *ngIf="appMode !== 'idle'"
            class="range-card__mode-btn"
            type="button"
            (click)="switchMode()">
      <span class="range-card__mode-btn-icon">{{ appMode === 'scale' ? '🔗' : '🎵' }}</span>
      <span>{{ appMode === 'scale' ? 'Scale + chord' : 'Scale' }}</span>
    </button>
  </div>

  <div class="range-toolbar">
    <button *ngFor="let preset of presets"
            class="range-preset"
            [class.range-preset--active]="activePreset === preset"
            [class.range-preset--custom]="preset.label === 'Custom' && isCustom"
            type="button"
            (click)="selectPreset(preset)">
      <span class="range-preset__icon">{{ preset.icon }}</span>
      <span class="range-preset__label">{{ preset.label }}</span>
      <span class="range-preset__value">{{ preset.min }} – {{ preset.max }}</span>
    </button>

    <div class="range-custom" *ngIf="isCustom">
      <input class="form-control range-custom__input"
             type="number"
             [(ngModel)]="customMin"
             min="0"
             [max]="customMax" />
      <span class="range-custom__separator">–</span>
      <input class="form-control range-custom__input"
             type="number"
             [(ngModel)]="customMax"
             [min]="customMin"
             [max]="neckConfig.numberOfFrets" />
      <button class="btn btn-success range-custom__button"
              type="button"
              (click)="applyCustom()">
        Show
      </button>
    </div>
  </div>
</section>
