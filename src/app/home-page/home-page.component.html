<main class="app-shell">
  <app-header></app-header>

  <!-- BEGIN: Command Bar -->
  <section class="command-bar">
    <div class="command-bar__toolbox">
      <app-toolbox-builder
        (toolboxEvent)="onToolboxEvent($event)"
      ></app-toolbox-builder>
    </div>
    <div class="command-bar__range">
      <app-range-toolbar (rangeChange)="onRangeChange($event)"></app-range-toolbar>
    </div>
  </section>
  <!-- END: Command Bar -->

  <!-- BEGIN: Fretboard Section -->
  <section class="fretboard-section">
    <div id="guitar-neck-container">
      <app-guitar-neck></app-guitar-neck>
    </div>

    <!-- Legend — shown only for Show commands (scale, chord, interval pattern) -->
    @if (displayMode() === 'legend') {
      <app-legend class="fretboard-section__legend"></app-legend>
    }

    <!-- Relationship strip — shown only for Compare (scale + chord relation) -->
    @if (displayMode() === 'relationship') {
      <app-relationship-strip class="fretboard-section__relationship"></app-relationship-strip>
    }
  </section>
  <!-- END: Fretboard Section -->

  <!-- BEGIN: Bottom Panel -->
  <section class="bottom-panel">
    <div class="bottom-panel__scale-info">
      <app-pattern-display></app-pattern-display>
    </div>
    <div class="bottom-panel__divider"></div>
    <div class="bottom-panel__metronome">
      <app-metronome></app-metronome>
    </div>
  </section>
  <!-- END: Bottom Panel -->

  <app-footer></app-footer>
</main>
