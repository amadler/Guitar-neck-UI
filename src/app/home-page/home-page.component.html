<main class="app-shell">
  <app-header></app-header>

  <div id="guitar-neck-container">
    <app-guitar-neck></app-guitar-neck>
  </div>

  <!-- Mode Selector — shown only on first visit (idle) -->
  <app-mode-selector *ngIf="(appMode$ | async) === 'idle'"></app-mode-selector>

  <!-- Legend — shown only in scale mode -->
  <app-legend *ngIf="(appMode$ | async) === 'scale'"></app-legend>

  <!-- Relationship Strip — shown only in scale-chord mode -->
  <app-relationship-strip *ngIf="(appMode$ | async) === 'scale-chord'"></app-relationship-strip>

  <!-- Pattern Display — hidden in idle, shown when something is active -->
  <app-pattern-display *ngIf="(appMode$ | async) !== 'idle'"></app-pattern-display>

  <section class="dock">
    <!-- Chord Degree Selector — kept in code, hidden in new layout -->
    <!-- <app-chord-degree-selector (chordDegreeSelected)="onChordDegreeSelected($event)"></app-chord-degree-selector> -->

    <!-- Scale mode — existing toolbox with scale/chord selection -->
    <div class="dock__body" *ngIf="(appMode$ | async) === 'scale'">
      <section id="toolbox-container">
        <lib-toolbox-form (onSubmit)="toolboxSubmit($event)"></lib-toolbox-form>
      </section>

      <section id="chat-container" *ngIf="chatEnabled; else chatDisabled">
        <app-chat></app-chat>
      </section>
      <ng-template #chatDisabled>
        <app-metronome></app-metronome>
      </ng-template>
    </div>

    <!-- Scale + Chord mode — dedicated form with independent scale/chord selection -->
    <app-scale-chord-form
      *ngIf="(appMode$ | async) === 'scale-chord'"
      (showRelation)="onScaleChordFormShow($event)"
    ></app-scale-chord-form>
  </section>

  <app-footer></app-footer>
</main>
