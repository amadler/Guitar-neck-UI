<main class="app-shell">
  <app-header></app-header>

  <div id="guitar-neck-container">
    <app-guitar-neck></app-guitar-neck>
  </div>
  <!-- <%- include('partials/range-toolbar.html') %>
      <%- include('partials/fretboard.html') %>
      <%- include('partials/legend.html') %> -->
  <app-legend></app-legend>
  <app-pattern-display></app-pattern-display>
  <section class="dock dock--expanded">
    <div class="dock__body">
      <section id="toolbox-container">
        <lib-toolbox-form (onSubmit)="toolboxSubmit($event)"></lib-toolbox-form>
      </section>

      <section id="chat-container" *ngIf="chatEnabled; else chatDisabled">
        <app-chat></app-chat>
      </section>
      <ng-template #chatDisabled>
        <section class="ai-placeholder">
          <div class="ai-placeholder__content">
            <div class="ai-placeholder__icon">💬</div>
            <h2>AI Assistant</h2>
            <span class="status-badge status-badge--large">POSTPONED</span>
            <p>AI features coming soon.</p>
            <p>Stay tuned!</p>
          </div>
        </section>
      </ng-template>
      <!-- <%- include('partials/dock-practice.html') %> -->
    </div>
  </section>

  <app-footer></app-footer>
</main>
