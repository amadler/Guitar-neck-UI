<main class="app-shell">
  <app-header></app-header>

  <div id="guitar-neck-container">
    <app-guitar-neck></app-guitar-neck>
  </div>

  <!-- Legend — shown only in scale mode -->
  <ng-container *ngIf="appMode$ | async as mode">
    <app-legend
      *ngIf="mode === 'scale-or-chord' || mode === 'custom-pattern'"
    ></app-legend>

    <app-relationship-strip
      *ngIf="mode === 'scale-chord'"
    ></app-relationship-strip>
  </ng-container>

  <app-pattern-display></app-pattern-display>

  <section class="dock">
    <!-- Chord Degree Selector — kept in code, hidden in new layout -->
    <!-- <app-chord-degree-selector (chordDegreeSelected)="onChordDegreeSelected($event)"></app-chord-degree-selector> -->

    <!-- Scale mode — existing toolbox with scale/chord selection -->
    <div class="dock__body">
      <section id="toolbox-container">
        <lib-forms-wrapper
          (onAppModeChange)="appModeChanged($event)"
          (onSubmitEv)="toolboxSubmit($event)"
          (toolboxEv)="onToolboxEvent($event)"
        ></lib-forms-wrapper>
      </section>

      <section id="chat-container" *ngIf="chatEnabled; else chatDisabled">
        <app-chat></app-chat>
      </section>
      <ng-template #chatDisabled>
        <app-metronome></app-metronome>
      </ng-template>
    </div>
  </section>

  <app-footer></app-footer>
</main>
