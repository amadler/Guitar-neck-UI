<main class="app-shell">
  <app-header></app-header>

  <div id="guitar-neck-container">
    <app-guitar-neck></app-guitar-neck>
  </div>

  <!-- Legend — shown only for Show commands (scale, chord, interval pattern) -->
  <app-legend *ngIf="displayMode() === 'legend'"></app-legend>

  <!-- Relationship strip — shown only for Compare (scale + chord relation) -->
  <app-relationship-strip *ngIf="displayMode() === 'relationship'"></app-relationship-strip>

  <app-pattern-display></app-pattern-display>

  <section class="dock">
    <div class="dock__body">
      <section id="toolbox-container">
        <app-toolbox-builder
          (toolboxEvent)="onToolboxEvent($event)"
        ></app-toolbox-builder>
      </section>

      <section id="chat-container" *ngIf="chatEnabled; else chatDisabled">
        <app-chat></app-chat>
      </section>
      <ng-template #chatDisabled>
        <app-metronome></app-metronome>
      </ng-template>
    </div>
  </section>

  <app-footer></app-footer>
</main>
