<div class="chord-degree-selector" *ngIf="visible">
  <label class="chord-degree-selector__label">Chord degree:</label>
  <div class="chord-degree-selector__buttons">
    <button
      *ngFor="let degree of degrees"
      class="chord-degree-selector__btn"
      (click)="onDegreeSelect(degree)"
      title="{{ degree.chordName }} on {{ degree.rootNote }}">
      {{ degree.label }}
      <span class="chord-degree-selector__btn-chord">{{ degree.chordName }}</span>
    </button>
  </div>
</div>
