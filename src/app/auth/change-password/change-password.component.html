<div class="auth-page">
  <div class="auth-card">
    <h2>Zmień hasło</h2>

    @if (success()) {
      <p class="success">✅ Hasło zostało zmienione.</p>
      <p class="desc">Możesz dalej korzystać z aplikacji — sesja pozostaje aktywna.</p>
    }

    <form (ngSubmit)="onSubmit()">
      <label>
        Obecne hasło
        <input
          type="password"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          required
          autocomplete="current-password"
        />
      </label>

      <label>
        Nowe hasło
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
          autocomplete="new-password"
        />
      </label>

      <label>
        Potwierdź nowe hasło
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          autocomplete="new-password"
        />
      </label>

      <button type="submit" [disabled]="sending()">
        {{ sending() ? 'Zapisywanie...' : 'Zmień hasło' }}
      </button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <p class="link">
      <a routerLink="/settings">← Powrót do ustawień</a>
    </p>
  </div>
</div>
