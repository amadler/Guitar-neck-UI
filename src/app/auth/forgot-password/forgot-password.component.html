<div class="auth-page">
  <div class="auth-card">
    <h2>Zapomniałem hasła</h2>

    @if (sent) {
      <p class="success">✅ Sprawdź swoją skrzynkę e-mail.</p>
      <p class="desc">
        Jeśli konto z tym adresem istnieje, wysłaliśmy link do zresetowania hasła.
      </p>
    } @else {
      <p class="desc">
        Podaj adres e-mail, a wyślemy Ci link do zresetowania hasła.
      </p>

      <form (ngSubmit)="onSubmit()">
        <label>
          Email
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </label>

        <button type="submit" [disabled]="sending || !email.trim()">
          {{ sending ? 'Wysyłanie...' : 'Wyślij link' }}
        </button>
      </form>

      @if (error) {
        <p class="error">{{ error }}</p>
      }
    }

    <p class="link">
      <a routerLink="/login">← Powrót do logowania</a>
    </p>
  </div>
</div>
