<header class="app-header">
  <div class="app-brand">
    <a class="app-brand__link" routerLink="/">
      <span class="app-brand__icon">🎸</span>
      <h1 class="app-brand__name">
        <a href="/">
          Guitar Neck <span class="app-brand__name--light">UI</span>
        </a>
      </h1>
    </a>
  </div>

  <div class="app-header__actions">
    <button
      class="icon-btn ai-toggle"
      type="button"
      [class.active]="domainService.currentState().aiModeEnabled"
      (click)="toggleAiMode()"
      aria-label="AI Chat"
    >
      <svg
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
        />
      </svg>
    </button>
  </div>
</header>
