<div class="guitar-neck" *ngIf="notes">
  <app-range-toolbar (rangeChange)="fretRange = $event"></app-range-toolbar>
  <div class="guitar-neck__fretboard">
    <div class="guitar-neck__fret-indices">
      <div class="guitar-neck__fret-index-spacer"></div>
      <div class="guitar-neck__fret-index-track">
        <div *ngFor="let fret of frets" class="guitar-neck__fret-index-cell">{{ fret + 1 }}</div>
      </div>
    </div>

    <div *ngFor="let string of strings; let i = index" [class]="'guitar-neck__string '+ string">
      <div class="guitar-neck__nut-label">{{ string }}</div>
      <div *ngFor="let fret of frets" class="guitar-neck__fret">
        <div class="guitar-neck__marker" *ngIf="isMarkedFret(string, fret)"></div>
        <div class="guitar-neck__marker_12" *ngIf="isMarkedTwelffeFret(string, fret)"></div>
        <ng-container *ngIf="fret === 0">
          <button class="guitar-neck__fret-number guitar-neck__dot"
                  *ngIf="isNoteOnFret(string, fret) && !isNoteSelected(string, fret) && isNoteInRange(fret)"
                  (click)="fretNoteClicked(string, fret)">
            {{ getNoteName(string, fret) }}
          </button>
        </ng-container>
        <ng-container *ngIf="fret !== 0">
          <button class="guitar-neck__dot"
                  *ngIf="isNoteOnFret(string, fret) && !isNoteSelected(string, fret) && isNoteInRange(fret)"
                  (click)="fretNoteClicked(string, fret)">
            {{ getNoteName(string, fret) }}
          </button>
        </ng-container>
        <ng-container *ngIf="isNoteOnFret(string, fret) && isNoteSelected(string, fret) && isNoteInRange(fret)">
          <div class="guitar-neck__selected">{{ getNoteName(string, fret) }}</div>
        </ng-container>
        <ng-container *ngIf="isNoteOnFret(string, fret) && getNoteInterval(string, fret) && isNoteInRange(fret)">
          <div [ngClass]="['guitar-neck__dot guitar-neck__'+getNoteInterval(string, fret)]">{{ getNoteName(string, fret) }}</div>
        </ng-container>
      </div>
    </div>
  </div>
  <app-legend></app-legend>
</div>
