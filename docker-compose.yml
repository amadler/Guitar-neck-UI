version: '3.8'
services:
  music-theory-api:
    image: music-theory-api:latest
    container_name: music-theory-api
    ports:
      - "3000:3000"
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - NODE_ENV=development
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - guitar-neck-network

  guitar-neck-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guitar-neck-ui
    ports:
      - "80:80"
    depends_on:
      - music-theory-api
    restart: unless-stopped
    networks:
      - guitar-neck-network

networks:
  guitar-neck-network:
    driver: bridge
