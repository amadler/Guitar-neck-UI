<h2 class="section-title">Select, what you want to see on guitar neck.</h2>
<form [formGroup]="guitarForm" (ngSubmit)="onSubmit()">
  <div class="form-row">
    <label for="scale">Scale, chord tone etc...</label>
    <select class="form-select" id="scale" formControlName="musicElements">
      <option *ngFor="let element of musicElements" [value]="element">{{element}}</option>
    </select>
  </div>

  <div class="form-row">
    <label for="key">Key of:</label>
    <select class="form-select" id="key" formControlName="keys">
      <option *ngFor="let key of keys" [value]="key">{{key}}</option>
    </select>
  </div>

  <button type="submit" [style.backgroundColor]="'#004400'" [style.color]="'#ffffff'">Show!</button>
</form>
